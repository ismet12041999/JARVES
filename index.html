<p>Bu sürüm sadece şunu kanıtlıyor: <b>Google Drive üzerinden hafıza kalıcılığı çalışıyor.</b> Bilgisayarı kapatıp başka birinden Google hesabınla girsen bile notların orada duruyor.</p>

<div class="card">
  <div id="status">Durum: Giriş yapılmadı</div>
  <button id="loginBtn">Google ile Giriş Yap</button>
</div>

<div class="card" id="workArea" style="display:none;">
  <h3>📁 Klasör Yapısı</h3>
  <button id="setupBtn">JARVIS Klasörlerini Oluştur / Kontrol Et</button>

  <h3>🧠 Kalıcı Not Testi</h3>
  <textarea id="noteInput" rows="3" placeholder="Buraya bir not yaz..."></textarea>
  <button id="saveBtn">Hafızaya Kaydet</button>
  <button id="loadBtn">Hafızadan Yükle</button>
</div>

<div class="card">
  <h3>💬 JARVIS ile Sohbet Et</h3>
  <div id="chatBox" style="max-height:300px; overflow-y:auto; background:#0f1117; padding:10px; border-radius:6px; margin-bottom:8px;"></div>
  <textarea id="chatInput" rows="2" placeholder="JARVIS'e bir şey sor..."></textarea>
  <button id="chatSendBtn">Gönder</button>
</div>

<div class="card">
  <h3>📜 Kayıt (Log)</h3>
  <div id="log">Hazır bekleniyor...</div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
const CLIENT_ID = "991987630312-ep602jl1rq640s0pmkinmnsoen0ds8b5.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.file";
const GEMINI_API_KEY = "";

let accessToken = null;
let folderIds = {};

function log(msg) {
  const el = document.getElementById("log");
  const time = new Date().toLocaleTimeString();
  el.textContent = `[${time}] ${msg}\n` + el.textContent;
}

function setStatus(text) {
  document.getElementById("status").textContent = "Durum: " + text;
}

let tokenClient = null;
const loginBtn = document.getElementById("loginBtn");
loginBtn.disabled = true;
loginBtn.textContent = "Yükleniyor...";

function initGoogle() {
  if (typeof google === "undefined" || !google.accounts) {
    log("HATA: Google giriş betiği (gsi/client) yüklenemedi. İnternet kafenin ağı veya bir eklenti (reklam engelleyici) bunu engelliyor olabilir. Sayfayı yenile (F5) ve bekle.");
    loginBtn.textContent = "Kullanılamıyor";
    return;
  }
  if (CLIENT_ID.includes("BURAYA_CLIENT_ID")) {
    log("HATA: CLIENT_ID hâlâ yer tutucu durumda.");
    loginBtn.textContent = "Kullanılamıyor";
    return;
  }
  try {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: (resp) => {
        if (resp.error) {
          log("Giriş hatası: " + JSON.stringify(resp));
          return;
        }
        accessToken = resp.access_token;
        setStatus("Giriş yapıldı ✅");
        document.getElementById("workArea").style.display = "block";
        log("Google girişi başarılı.");
      }
    });
    loginBtn.disabled = false;
    loginBtn.textContent = "Google ile Giriş Yap";
    log("Google giriş sistemi hazır. Şimdi butona basabilirsin.");
  } catch (e) {
    log("HATA (initTokenClient): " + e.message);
    loginBtn.textContent = "Kullanılamıyor";
  }
}

window.addEventListener("load", () => {
  let tries = 0;
  let warned = false;
  const check = setInterval(() => {
    tries++;
    if (typeof google !== "undefined" && google.accounts) {
      clearInterval(check);
      initGoogle();
    } else if (tries === 40 && !warned) {
      warned = true;
      log("Google giriş betiği hâlâ yükleniyor (ağ yavaş olabilir), beklemeye devam ediliyor...");
    } else if (tries === 400) {
      clearInterval(check);
      log("HATA: 100 saniye geçti, script hiç yüklenmedi. Sayfayı yenile (F5) veya farklı bir ağ/bilgisayar dene.");
      loginBtn.textContent = "Kullanılamıyor";
    }
  }, 250);
});

loginBtn.onclick = () => {
  if (!tokenClient) {
    log("Giriş sistemi henüz hazır değil, birkaç saniye bekleyip tekrar dene.");
    return;
  }
  tokenClient.requestAccessToken();
};

async function driveFetch(url, options = {}) {
  options.headers = Object.assign({}, options.headers, {
    "Authorization": "Bearer " + accessToken
  });
  const res = await fetch(url, options);
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`Drive API hatası (${res.status}): ${errText}`);
  }
  return res.json();
}

async function findOrCreateFolder(name, parentId) {
  let q = `name='${name}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
  if (parentId) q += ` and '${parentId}' in parents`;
  const searchUrl = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`;
  const result = await driveFetch(searchUrl);

  if (result.files && result.files.length > 0) {
    log(`Klasör bulundu: ${name}`);
    return result.files[0].id;
  }

  const metadata = {
    name: name,
    mimeType: "application/vnd.google-apps.folder"
  };
  if (parentId) metadata.parents = [parentId];

  const created = await driveFetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(metadata)
  });
  log(`Klasör oluşturuldu: ${name}`);
  return created.id;
}

document.getElementById("setupBtn").onclick = async () => {
  try {
    log("Klasör yapısı kontrol ediliyor...");
    const jarvisId = await findOrCreateFolder("JARVIS", null);
    folderIds.JARVIS = jarvisId;
    for (const sub of ["Hafıza", "Bilgi", "Projeler", "Sistem"]) {
      folderIds[sub] = await findOrCreateFolder(sub, jarvisId);
    }
    log("Tüm klasörler hazır: " + JSON.stringify(folderIds));
  } catch (e) {
    log("HATA: " + e.message);
  }
};

async function findMemoryFile() {
  const q = `name='hafiza.json' and '${folderIds["Hafıza"]}' in parents and trashed=false`;
  const url = `https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`;
  const result = await driveFetch(url);
  return (result.files && result.files.length > 0) ? result.files[0].id : null;
}

document.getElementById("saveBtn").onclick = async () => {
  try {
    if (!folderIds["Hafıza"]) {
      log("Önce 'JARVIS Klasörlerini Oluştur' butonuna bas.");
      return;
    }
    const note = document.getElementById("noteInput").value;
    let existing = [];
    const existingId = await findMemoryFile();
    if (existingId) {
      const fileData = await driveFetch(`https://www.googleapis.com/drive/v3/files/${existingId}?alt=media`);
      existing = Array.isArray(fileData) ? fileData : [];
    }
    existing.push({ text: note, date: new Date().toISOString() });

    const boundary = "jarvis_boundary";
    const metadata = existingId ? {} : { name: "hafiza.json", parents: [folderIds["Hafıza"]] };
    const body =
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(metadata)}\r\n` +
      `--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(existing)}\r\n` +
      `--${boundary}--`;

    const url = existingId
      ? `https://www.googleapis.com/upload/drive/v3/files/${existingId}?uploadType=multipart`
      : `https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart`;
    const method = existingId ? "PATCH" : "POST";

    await driveFetch(url, {
      method,
      headers: { "Content-Type": `multipart/related; boundary=${boundary}` },
      body
    });
    log("Not Drive'a kaydedildi ✅ (hafiza.json)");
    document.getElementById("noteInput").value = "";
  } catch (e) {
    log("HATA: " + e.message);
  }
};

document.getElementById("loadBtn").onclick = async () => {
  try {
    if (!folderIds["Hafıza"]) {
      log("Önce 'JARVIS Klasörlerini Oluştur' butonuna bas.");
      return;
    }
    const existingId = await findMemoryFile();
    if (!existingId) {
      log("Henüz kayıtlı not yok.");
      return;
    }
    const fileData = await driveFetch(`https://www.googleapis.com/drive/v3/files/${existingId}?alt=media`);
    log("Kayıtlı notlar:\n" + JSON.stringify(fileData, null, 2));
  } catch (e) {
    log("HATA: " + e.message);
  }
};

const chatBox = document.getElementById("chatBox");
const chatInput = document.getElementById("chatInput");
const chatSendBtn = document.getElementById("chatSendBtn");
let chatHistory = [];

function addChatBubble(role, text) {
  const bubble = document.createElement("div");
  bubble.style.margin = "6px 0";
  bubble.style.padding = "8px 10px";
  bubble.style.borderRadius = "6px";
  bubble.style.maxWidth = "85%";
  if (role === "user") {
    bubble.style.background = "#4da3ff";
    bubble.style.color = "#fff";
    bubble.style.marginLeft = "auto";
    bubble.style.textAlign = "right";
  } else {
    bubble.style.background = "#2a2e3a";
    bubble.style.color = "#eaeaea";
  }
  bubble.textContent = text;
  chatBox.appendChild(bubble);
  chatBox.scrollTop = chatBox.scrollHeight;
}

async function sendChatMessage() {
  const text = chatInput.value.trim();
  if (!text) return;

  if (GEMINI_API_KEY.includes("BURAYA_GEMINI_API_KEY")) {
    log("HATA: GEMINI_API_KEY hâlâ yer tutucu durumda.");
    return;
  }

  addChatBubble("user", text);
  chatInput.value = "";
  chatSendBtn.disabled = true;
  chatSendBtn.textContent = "Düşünüyor...";

  chatHistory.push({ role: "user", parts: [{ text }] });

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_API_KEY}`;
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ contents: chatHistory })
    });
    if (!res.ok) {
      const errText = await res.text();
      throw new Error(`Gemini API hatası (${res.status}): ${errText}`);
    }
    const data = await res.json();
    const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "(Cevap alınamadı)";
    chatHistory.push({ role: "model", parts: [{ text: reply }] });
    addChatBubble("model", reply);
    log("Sohbet mesajı gönderildi ve cevap alındı.");
  } catch (e) {
    log("HATA: " + e.message);
    addChatBubble("model", "Bir hata oldu, log kutusuna bak.");
  } finally {
    chatSendBtn.disabled = false;
    chatSendBtn.textContent = "Gönder";
  }
}

chatSendBtn.onclick = sendChatMessage;
chatInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendChatMessage();
  }
});
</script>
</body>
